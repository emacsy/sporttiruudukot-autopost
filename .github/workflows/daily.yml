name: Päivän ruudukot

on:
  schedule:
    # Joka aamu klo 05.17 UTC (talvella 7.17, kesällä 8.17 Suomen aikaa).
    # Uudet ruudukot julkaistaan sivulla keskiyöllä Suomen aikaa.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Julkaise Instagramiin (pois päältä = tee vain kuvat)"
        type: boolean
        default: true
      stories:
        description: "Julkaise myös tarinat"
        type: boolean
        default: true
      tiktok:
        description: "Lähetä TikTokiin"
        type: boolean
        default: true

permissions:
  contents: write   # kuvat tallennetaan kuvat-haaraan, josta Instagram hakee ne

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Tee kuvat
        run: node generate.js

      - name: Tee TikTok-video
        id: video
        if: vars.TIKTOK_FORMAT == 'video' || vars.TIKTOK_FORMAT == 'both'
        continue-on-error: true   # videon virhe ei estä Instagram-julkaisua
        run: node make_video.js "output/$(TZ=Europe/Helsinki date +%F)"

      - name: Tallenna kuvat ladattaviksi
        uses: actions/upload-artifact@v4
        with:
          name: ruudukot
          path: output/
          retention-days: 14

      - name: Julkaise kuvat kuvat-haaraan
        id: images
        run: |
          DATE=$(TZ=Europe/Helsinki date +%F)
          cd output
          git init -q -b kuvat
          git add "$DATE"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Kuvat $DATE"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kuvat
          echo "dir=output/$DATE" >> "$GITHUB_OUTPUT"
          echo "url=https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)/$DATE/" >> "$GITHUB_OUTPUT"

      - name: Julkaise Instagramiin
        if: github.event_name == 'schedule' || inputs.publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: ${{ steps.images.outputs.url }}
          SKIP_STORIES: ${{ (github.event_name != 'schedule' && !inputs.stories) && '1' || '' }}
        run: node publish.js "${{ steps.images.outputs.dir }}"

      - name: Lähetä TikTokiin
        if: ${{ !cancelled() && steps.images.outcome == 'success' && steps.video.outcome != 'failure' && vars.TIKTOK_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.tiktok) }}
        continue-on-error: true   # TikTok-virhe ei kaada Instagram-julkaisua
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_FORMAT: ${{ vars.TIKTOK_FORMAT || 'photo' }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'inbox' }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}
        run: node publish_tiktok.js "${{ steps.images.outputs.dir }}"
